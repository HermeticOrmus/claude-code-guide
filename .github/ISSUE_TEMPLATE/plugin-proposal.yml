name: Plugin proposal
description: Propose a new agent, skill, command or hook for the starter kit, or a new example for the guide.
title: "[Proposal] "
labels: ["plugin-proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Good proposals name a real job people do when they set up or use Claude Code, what Claude gets wrong today without it, and how anyone could check it works. Accepted proposals can become Menu items that you or someone else builds.
  - type: input
    id: name
    attributes:
      label: Working name
      placeholder: "kebab-case, e.g. commit-message-writer"
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: The job it does
      description: Who needs it, and what they are trying to get done.
      placeholder: "e.g. people new to Claude Code who want a hook that blocks edits to secret files, ready to copy"
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What goes wrong today without it
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A check anyone could run to see it works. For example, a prompt, the agent or skill that should answer, and what the answer must contain.
      placeholder: "e.g. claude plugin validate starter-kit passes, and claude plugin details starter-kit@claude-code-guide lists the new skill"
    validations:
      required: true
  - type: textarea
    id: prior
    attributes:
      label: Prior art
      description: Other guides, packs, tools or docs that do something similar, with links. The pantry competitor map (pantry/) lists what we already know about.
  - type: checkboxes
    id: build
    attributes:
      label: Want to build it?
      options:
        - label: I would like to build this and open a pull request.
